<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover lets the app draw under the iPhone notch/home bar; CSS safe-area insets keep content clear of them. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0f1115" />
    <meta name="description" content="Local-first workout tracker for your home gym." />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- iOS ignores manifest icons and uses this one for the home screen. -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- iOS: run full-screen when launched from the home screen. -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Gym" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <title>Home Gym Tracker</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
